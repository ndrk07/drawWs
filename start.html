<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelBattle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #2c3e50;
            font-family: sans-serif;
            overflow: hidden;
        }
        #toolbar {
            background-color: #34495e;
            padding: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .btn {
            background: #1abc9c;
            border: none;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn.active {
            background: #e67e22;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            /* Отключаем сглаживание во всех браузерах */
            image-rendering: -moz-crypto-經營; /* Старый Firefox */
            image-rendering: -moz-pixelated;   /* Firefox */
            image-rendering: -webkit-crisp-edges; /* Safari / WebKit */
            image-rendering: pixelated;        /* Chrome / Opera / Edge / Android */
            image-rendering: crisp-edges;
        }   
        .hint {
            margin-left: auto;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <label>Цвет: <input type="color" id="colorPicker" value="#000000"></label>
        <button id="toolDraw" class="btn active">Карандаш</button>
        <button id="toolErase" class="btn">Ластик</button>
        <button id="resetView" class="btn" style="background:#7f8c8d;">Сбросить камеру</button>
        <div class="hint">Колесико: зум | Клик колесиком (или Пробел+ЛКМ): перемещение</div>
    </div>

    <div id="canvas-container">
        <canvas id="pixelCanvas"></canvas>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');

        // Размеры пиксельного холста (например, 64x64 пикселя)
        const ROWS = 64;
        const COLS = 64;
        const PIXEL_SIZE = 10; // Базовый размер одного пикселя на экране

        // Двумерный массив для хранения цветов пикселей (null — пустой/прозрачный)
        const grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

        // Состояние камеры (зум и панорамирование)
        let scale = 1;
        let offsetX = 100; // Начальный отступ слева
        let offsetY = 100; // Начальный отступ сверху

        // Состояние инструментов
        let currentTool = 'draw'; // 'draw' или 'erase'
        let isDrawing = false;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let isSpacePressed = false;

        // Элементы интерфейса
        const colorPicker = document.getElementById('colorPicker');
        const toolDraw = document.getElementById('toolDraw');
        const toolErase = document.getElementById('toolErase');
        const resetViewBtn = document.getElementById('resetView');

        // Подгоняем размер физического canvas под экран
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        // Функция отрисовки всего холста
        function render() {
            // Очищаем экран
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Применяем трансформацию камеры (смещение и зум)
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Отключаем размытие пикселей при сильном приближении
            ctx.imageSmoothingEnabled = false;

            // 1. Рисуем фон-сетку (шахматку) для прозрачных пикселей
            const bgSize = PIXEL_SIZE;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#e0e0e0';
                    ctx.fillRect(c * bgSize, r * bgSize, bgSize, bgSize);

                    // Если в массиве есть цвет — рисуем поверх сохраненный пиксель
                    if (grid[r][c]) {
                        ctx.fillStyle = grid[r][c];
                        ctx.fillRect(c * bgSize, r * bgSize, bgSize, bgSize);
                    }
                }
            }

            // 2. Рисуем тонкую сетку-границы между пикселями
            ctx.strokeStyle = '#rgba(0,0,0,0.1)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (let i = 0; i <= COLS; i++) {
                ctx.moveTo(i * bgSize, 0);
                ctx.lineTo(i * bgSize, ROWS * bgSize);
            }
            for (let j = 0; j <= ROWS; j++) {
                ctx.moveTo(0, j * bgSize);
                ctx.lineTo(COLS * bgSize, j * bgSize);
            }
            ctx.stroke();

            ctx.restore();
        }

        // Превращает экранные координаты мыши в индексы строки и столбца нашей сетки
        function getGridCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = clientX - rect.left;
            const canvasY = clientY - rect.top;

            // Обратный расчет с учетом смещения и зума
            const gridX = (canvasX - offsetX) / scale;
            const gridY = (canvasY - offsetY) / scale;

            const col = Math.floor(gridX / PIXEL_SIZE);
            const row = Math.floor(gridY / PIXEL_SIZE);

            return { row, col };
        }

        // Действие рисования или стирания
        function handleAction(e) {
            const { row, col } = getGridCoords(e.clientX, e.clientY);

            // Проверяем, что клик попал внутрь рабочей сетки
            if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                if (currentTool === 'draw') {
                    grid[row][col] = colorPicker.value;
                } else if (currentTool === 'erase') {
                    grid[row][col] = null;
                }
                render();
            }
        }

        // --- ОБРАБОТКА СОБЫТИЙ МЫШИ ---

        container.addEventListener('mousedown', (e) => {
            // Клик колесиком мыши (button === 1) или зажатый пробел активируют перемещение
            if (e.button === 1 || isSpacePressed) {
                isPanning = true;
                startPanX = e.clientX - offsetX;
                startPanY = e.clientY - offsetY;
                e.preventDefault();
                return;
            }

            // Обычный левый клик — рисуем
            if (e.button === 0) {
                isDrawing = true;
                handleAction(e);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                offsetX = e.clientX - startPanX;
                offsetY = e.clientY - startPanY;
                render();
            } else if (isDrawing) {
                handleAction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
            isPanning = false;
        });

        // Реализация ЗУМА (приближение к точке курсора)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = 1.1;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Запоминаем точку на холсте до зума
            const wheelX = (mouseX - offsetX) / scale;
            const wheelY = (mouseY - offsetY) / scale;

            // Меняем масштаб
            if (e.deltaY < 0) {
                scale *= zoomFactor; // Приближение
            } else {
                scale /= zoomFactor; // Отдаление
            }

            // Ограничиваем зум, чтобы не ломать графику
            scale = Math.max(0.5, Math.min(scale, 50));

            // Корректируем смещение, чтобы зум шел ровно в точку мыши
            offsetX = mouseX - wheelX * scale;
            offsetY = mouseY - wheelY * scale;

            render();
        }, { passive: false });

        // Отслеживание нажатия пробела
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') isSpacePressed = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') isSpacePressed = false;
        });

        // Переключение инструментов
        toolDraw.addEventListener('click', () => {
            currentTool = 'draw';
            toolDraw.classList.add('active');
            toolErase.classList.remove('active');
        });

        toolErase.addEventListener('click', () => {
            currentTool = 'erase';
            toolErase.classList.add('active');
            toolDraw.classList.remove('active');
        });

        function centerCanvas() {
            const rect = container.getBoundingClientRect();
            // Изменение 3: Расчет теперь учитывает переменную scale
            offsetX = (rect.width - (COLS * PIXEL_SIZE) * scale) / 2;
            offsetY = (rect.height - (ROWS * PIXEL_SIZE) * scale) / 2;
        }

        resetViewBtn.addEventListener('click', () => {
            scale = 1;
            offsetX = (canvas.width - COLS * PIXEL_SIZE) / 2;
            offsetY = (canvas.height - ROWS * PIXEL_SIZE) / 2;
            render();
        });

        // Стартовая инициализация
        resizeCanvas();
        // Центрируем холст при запуске
        centerCanvas();
        render();
    </script>
</body>
</html>
